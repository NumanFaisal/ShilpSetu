name: ShilpSetu-AI-APKs

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ShilpSetu-AI-APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # prebuild AFTER npm install so postinstall patch runs first,
      # then prebuild regenerates android/ from the (now patched) node_modules
      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          # Increase JVM heap for large RN builds
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          cd android
          # Build debug APK — avoids release minification/signing issues that cause crashes
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -x lint \
            -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShilpSetu-AI-APKs
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
